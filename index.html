<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>移动平均价计算器</title>
    <link rel="stylesheet" href="assets/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="assets/flatpickr/flatpickr.min.css">
    <script src="assets/flatpickr/flatpickr.min.js"></script>
    <script src="assets/flatpickr/l10n/zh.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif;
            padding: 20px;
            background-color: #f5f7fa;
            color: #333;
        }

        .container {
            max-width: 900px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            padding: 30px 36px;
            margin-top: 20px;
        }

        .container h1 {
            margin-bottom: 28px;
            font-weight: 600;
            color: #2c3e50;
        }

        .container h2 {
            margin-top: 30px;
        }

        /* --- 月份选择器 --- */
        .month-picker-section {
            margin-bottom: 24px;
        }

        .month-picker-section label {
            font-weight: 500;
            color: #555;
            margin-bottom: 10px;
            display: block;
        }

        .year-nav {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-bottom: 12px;
        }

        .year-nav button {
            background: none;
            border: 1px solid #dcdfe6;
            border-radius: 6px;
            width: 32px;
            height: 32px;
            cursor: pointer;
            font-size: 16px;
            color: #606266;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .year-nav button:hover {
            border-color: #409eff;
            color: #409eff;
        }

        .year-nav span {
            font-size: 18px;
            font-weight: 600;
            color: #303133;
            min-width: 60px;
            text-align: center;
        }

        .month-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            max-width: 360px;
        }

        .month-grid .month-btn {
            padding: 10px 0;
            border: 1px solid #e4e7ed;
            border-radius: 8px;
            background: #fff;
            cursor: pointer;
            font-size: 14px;
            color: #606266;
            text-align: center;
            transition: all 0.2s;
        }

        .month-grid .month-btn:hover:not(.disabled):not(.active) {
            border-color: #c6e2ff;
            color: #409eff;
            background: #ecf5ff;
        }

        .month-grid .month-btn.active {
            background: #409eff;
            color: #fff;
            border-color: #409eff;
            font-weight: 500;
        }

        .month-grid .month-btn.disabled {
            color: #c0c4cc;
            background: #f5f7fa;
            cursor: not-allowed;
            border-color: #e4e7ed;
        }

        .month-grid .month-btn.today:not(.active):not(.disabled) {
            border-color: #409eff;
            color: #409eff;
        }

        /* --- 日期与计算控制行 --- */
        .date-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .date-row label {
            white-space: nowrap;
            font-weight: 500;
            color: #555;
            font-size: 14px;
        }

        .date-row .form-control {
            flex: 1;
            min-width: 120px;
            max-width: 160px;
        }

        .form-control {
            border-radius: 8px;
            border: 1px solid #dcdfe6;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-control:focus {
            border-color: #409eff;
            box-shadow: 0 0 0 3px rgba(64, 158, 255, 0.15);
        }

        /* --- 通用按钮 --- */
        .btn {
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .btn-primary {
            padding: 7px 24px;
            box-shadow: 0 2px 6px rgba(0, 123, 255, 0.15);
        }

        .btn-primary:hover {
            box-shadow: 0 4px 12px rgba(0, 123, 255, 0.25);
        }

        .btn-outline-secondary {
            padding: 7px 16px;
        }

        /* --- MA结果行 --- */
        .ma-result-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 24px;
        }

        .ma-result-row .form-control {
            flex: 1;
            max-width: 260px;
        }

        /* --- 换算区域 --- */
        .calc-section {
            background: #f9fafc;
            border: 1px solid #ebeef5;
            border-radius: 10px;
            padding: 20px 24px;
            margin-top: 20px;
        }

        .calc-section-title {
            font-size: 14px;
            font-weight: 500;
            color: #909399;
            margin-bottom: 14px;
        }

        .calc-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .calc-row .form-control {
            flex: 1;
            min-width: 120px;
        }

        .calc-row .calc-sep {
            color: #c0c4cc;
            font-size: 18px;
            flex-shrink: 0;
        }

        /* --- 统计 --- */
        .ma-stats span {
            font-size: 2rem;
        }

        .stats {
            color: #999;
        }

        .stats span {
            font-size: 0.95rem;
            color: #999;
        }

        .ma-label {
            margin-right: 20px;
        }

        /* --- 明细 --- */
        #lastPriceDetails {
            background: #fafbfc;
            border: 1px solid #ebeef5;
            border-radius: 8px;
            padding: 14px 18px;
            font-size: 13px;
            color: #606266;
            line-height: 1.7;
            max-height: 400px;
            overflow-y: auto;
        }

        /* --- 底部链接 --- */
        .link-container {
            display: flex;
            justify-content: center;
            gap: 40px;
            text-align: center;
            margin-top: 28px;
            padding: 14px 0;
            font-size: 15px;
            border-top: 1px solid #ebeef5;
        }

        .link-container a {
            color: #409eff;
            text-decoration: none;
            transition: color 0.2s;
        }

        .link-container a:hover {
            color: #66b1ff;
            text-decoration: underline;
        }

        /* --- flatpickr 日期选择器美化 --- */
        .flatpickr-input {
            cursor: pointer;
        }

        .flatpickr-calendar {
            border-radius: 10px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
            border: none;
        }

        .flatpickr-months {
            border-radius: 10px 10px 0 0;
        }

        .flatpickr-day.selected,
        .flatpickr-day.selected:hover {
            background: #409eff;
            border-color: #409eff;
        }

        .flatpickr-day:hover {
            background: #ecf5ff;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>CKB移动平均线（MA）</h1>

    <!-- 月份选择器：4行3列 -->
    <div class="month-picker-section">
        <label>选择月份</label>
        <div class="year-nav">
            <button type="button" id="prevYear" title="上一年">&#8249;</button>
            <span id="yearDisplay"></span>
            <button type="button" id="nextYear" title="下一年">&#8250;</button>
        </div>
        <div class="month-grid" id="monthGrid"></div>
    </div>

    <!-- 日期范围 + 计算按钮 -->
    <div class="date-row">
        <label for="startTime1">开始日期:</label>
        <input type="text" class="form-control" id="startTime1" placeholder="选择开始日期">
        <label for="startTime2">结束日期:</label>
        <input type="text" class="form-control" id="startTime2" placeholder="选择结束日期">
        <button onclick="fetchMovingAverages()" class="btn btn-primary">计算MA</button>
    </div>

    <!-- MA结果 -->
    <div class="ma-result-row">
        <input type="text" class="form-control" id="MA" placeholder="MA价格（收盘价平均值）" readonly>
        <button class="btn btn-outline-secondary" type="button" onclick="copyMA()">复制</button>
    </div>

    <!-- USDT/CKB 换算区域 -->
    <div class="calc-section">
        <div class="calc-section-title">USDT → CKB 换算</div>
        <div class="calc-row">
            <input type="text" class="form-control" id="usdtInput" placeholder="USDT数量">
            <span class="calc-sep">÷</span>
            <input type="text" class="form-control" id="ckbInput" placeholder="CKB价格">
            <button onclick="calculateResult()" class="btn btn-primary">=</button>
            <input type="text" class="form-control" id="resultOutput" placeholder="CKB数量" readonly>
            <button class="btn btn-outline-secondary" type="button" onclick="copyResult()">复制</button>
        </div>
    </div>

    <h2 id="ma-stats" class="ma-stats"></h2>
    <h3 id="stats" class="stats"></h3>

    <pre id="lastPriceDetails"></pre>

    <div class="link-container">
        <a href="https://www.binance.com/zh-CN/trade/CKB_USDT" target="_blank">CKB/USDT 交易页</a>
        <a href="https://github.com/binance/binance-spot-api-docs/blob/master/rest-api_CN.md#k线数据" target="_blank">数据源API</a>
    </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    flatpickr.localize(flatpickr.l10ns.zh);

    const today = new Date();
    const currentDay = today.getDate();
    const monthNames = ['1月', '2月', '3月', '4月', '5月', '6月',
                         '7月', '8月', '9月', '10月', '11月', '12月'];

    let selectedMonth = today;
    if (currentDay <= 10) {
      selectedMonth = new Date(today.getFullYear(), today.getMonth() - 1, 1);
    }

    let pickerYear = selectedMonth.getFullYear();
    let pickerMonth = selectedMonth.getMonth(); // 0-based

    // 初始化日期选择器
    const startTime1Picker = flatpickr("#startTime1", {
      enableTime: false,
      dateFormat: "Y-m-d",
      defaultDate: new Date(selectedMonth.getFullYear(), selectedMonth.getMonth(), 10),
      locale: 'zh'
    });

    const startTime2Picker = flatpickr("#startTime2", {
      enableTime: false,
      dateFormat: "Y-m-d",
      defaultDate: new Date(selectedMonth.getFullYear(), selectedMonth.getMonth() + 1, 9),
      locale: 'zh'
    });

    // 月份选择后更新日期范围
    function onMonthSelected(year, month) {
      pickerYear = year;
      pickerMonth = month;
      startTime1Picker.setDate(new Date(year, month, 10));
      startTime2Picker.setDate(new Date(year, month + 1, 9));
      renderMonthGrid();
    }

    // 渲染月份网格
    function renderMonthGrid() {
      const grid = document.getElementById('monthGrid');
      document.getElementById('yearDisplay').textContent = pickerYear + '年';
      grid.innerHTML = '';

      const nowYear = today.getFullYear();
      const nowMonth = today.getMonth();

      for (let i = 0; i < 12; i++) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'month-btn';
        btn.textContent = monthNames[i];

        const isFuture = pickerYear > nowYear || (pickerYear === nowYear && i > nowMonth);

        if (isFuture) {
          btn.classList.add('disabled');
        } else {
          if (pickerYear === pickerYear && i === pickerMonth) {
            btn.classList.add('active');
          }
          if (pickerYear === nowYear && i === nowMonth) {
            btn.classList.add('today');
          }
          btn.addEventListener('click', function () {
            onMonthSelected(pickerYear, i);
          });
        }

        grid.appendChild(btn);
      }

      // 控制年份导航按钮状态
      document.getElementById('nextYear').disabled = pickerYear >= nowYear;
      document.getElementById('nextYear').style.opacity = pickerYear >= nowYear ? '0.3' : '1';
    }

    // 年份导航
    document.getElementById('prevYear').addEventListener('click', function () {
      pickerYear--;
      renderMonthGrid();
    });

    document.getElementById('nextYear').addEventListener('click', function () {
      if (pickerYear < today.getFullYear()) {
        pickerYear++;
        renderMonthGrid();
      }
    });

    renderMonthGrid();
  });

  function fetchMovingAverages() {
    const startTime1 = new Date(document.getElementById('startTime1').value + "T00:00:00Z").getTime();
    const startTime2 = new Date(document.getElementById('startTime2').value + "T00:00:00Z").getTime();

    // 保存日期到LocalStorage
    const startTimestamp = new Date(startTime1).getTime();
    const endTimestamp = new Date(startTime2).getTime();
    localStorage.setItem('startDate', startTimestamp);
    localStorage.setItem('endDate', endTimestamp);

    // fetch('http://localhost:3000/calculateMA', {
    fetch('https://web3zhu.cn/calculateMA', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ startTime1, startTime2 })
    })
      .then(response => response.json())
      .then(data => {
        document.getElementById('MA').value = data.MA;
        document.getElementById('ckbInput').value = data.MA;

        const totalCkb = data.dailyLastPrice.reduce((sum, item) => sum + parseFloat(item.ckb), 0);
        const totalUsdt = data.dailyLastPrice.reduce((sum, item) => sum + parseFloat(item.usdt), 0);
        const ratio = totalUsdt / totalCkb;
        document.getElementById('ma-stats').innerHTML = `
          <span class="text-primary ma-label">MA(${data.days})</span>
          <span class="text-success">总收盘价(${data.sum})</span> /
          <span class="text-info">总天数(${data.dailyLastPrice.length})</span> =
          <span class="text-warning">${data.MA}</span>`;

        document.getElementById('stats').innerHTML = `
          <span>总成交额(${parseInt(totalUsdt)})</span> /
          <span>总成交量(${totalCkb})</span> =
          <span>${ratio.toFixed(6)}</span>`;

        document.getElementById('lastPriceDetails').textContent = data.dailyLastPrice.map(item =>
          `${item.date} 收盘价: ${item.lastPrice}, 成交量(CKB): ${item.ckb}, 成交额(USDT): ${item.usdt}`
        ).join('\n');
      })
      .catch(error => console.error('Error fetching moving averages:', error));
  }

  function copyMA() {
    const MA = document.getElementById('MA').value;
    navigator.clipboard.writeText(MA)
      .then(() => {
        console.log('Text successfully copied to clipboard');
      })
      .catch(err => {
        console.error('Failed to copy text to clipboard:', err);
      });
  }

  function calculateResult() {
    const usdtPrice = parseFloat(document.getElementById('usdtInput').value);
    const ckbPrice = parseFloat(document.getElementById('ckbInput').value);
    document.getElementById('resultOutput').value = (usdtPrice / ckbPrice).toFixed(8);
  }

  function copyResult() {
    const result = document.getElementById('resultOutput').value;
    navigator.clipboard.writeText(result)
      .then(() => console.log('Result copied to clipboard!'))
      .catch(err => console.error('Failed to copy result:', err));
  }

</script>
</body>
</html>
